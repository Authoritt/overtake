# Project-wide Gradle settings (mirrors the OpenCfMoto cockpit toolchain).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Kotlin code style: "official".
kotlin.code.style=official
# Faster incremental builds: reuse the configuration phase and task outputs across builds.
org.gradle.configuration-cache=true
org.gradle.caching=true
# AndroidX only (no legacy support library / Jetifier).
android.useAndroidX=true
# Maven coordinates — SINGLE SOURCE OF TRUTH for every module. Gradle maps the special `group` and
# `version` keys onto project.group / project.version for the root AND all subprojects, so the
# published artifacts (dev.overtake:overtake, dev.overtake:overtake-maps, dev.overtake:brouter) and
# the composite-build substitution the OpenCfMoto fork relies on both read them from here. Bump
# `version` once to cut a new release of all three artifacts.
group=dev.overtake
version=0.1.0
